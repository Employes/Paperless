# .github/workflows/deploy.yml

# Workflow name
name: 'Deploy'

# Event for the workflow
on: push

permissions:
  id-token: write # Required for OIDC
  contents: write

# List of jobs
jobs:
  # lint:
  #     runs-on: ubuntu-latest
  #     if: |
  #         !contains(github.event.head_commit.message, 'no-release') && !contains(github.event.head_commit.message, 'Lerna publish')
  #     steps:
  #         - uses: actions/checkout@v2

  #         - name: Setup node
  #           uses: actions/setup-node@v2
  #           with:
  #               node-version: 14

  #         - uses: c-hive/gha-yarn-cache@v1

  #         - name: Install dependencies
  #           run: yarn

  # - name: Lint
  #   run: yarn lerna:lint

  build:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, 'no-build') &&
      !contains(github.event.head_commit.message, 'Lerna publish')
    steps:
      - name: 'Checkout' # Download code from the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Checkout all branches and tags

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - uses: oleksiyrudenko/gha-git-credentials@v2.1.2
        with:
          name: 'Github Actions'
          email: 'actions@github.com'
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Version
        if: |
          github.ref == 'refs/heads/main'
        run: yarn lerna:version:prod:nopush

      - name: Version Preview
        if: |
          github.ref == 'refs/heads/preview'
        run: yarn lerna:version:prerelease:nopush

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn lerna:build:prod

      - name: Lint
        run: yarn lerna:lint

      - name: Push changes
        if: |
          github.ref == 'refs/heads/main' &&
          !contains(github.event.head_commit.message, 'chore')
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

      - name: Push changes Preview
        if: |
          github.ref == 'refs/heads/preview' &&
          !contains(github.event.head_commit.message, 'chore')
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            lerna.json
            CHANGELOG.md
            packages/core/package.json
            packages/core/CHANGELOG.md
            packages/core/component-docs.json
            packages/core/component-docs.d.ts
            packages/conventions/package.json
            packages/conventions/CHANGELOG.md
            packages/angular/package.json
            packages/angular/CHANGELOG.md
            packages/react/package.json
            packages/react/CHANGELOG.md
            packages/core/dist
            packages/core/loader
            packages/core/hydrate
            packages/conventions/dist
            packages/angular/dist
            packages/react/dist

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/preview') &&
      !contains(github.event.head_commit.message, 'no-release') &&
      !contains(github.event.head_commit.message, 'Lerna publish') &&
      !contains(github.event.head_commit.message , 'docs:') &&
      !contains(github.event.head_commit.message , 'docs(') &&
      !contains(github.event.head_commit.message, 'chore')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Update npm
        run: |
          npm install -g npm@~11.10.0
          npm install -g npm@latest

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Release
        if: |
          github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn lerna:publish

      - name: Release Preview
        if: |
          github.ref == 'refs/heads/preview'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn lerna:publish:prerelease

  deploy-storybook:
    needs: [build]
    if: |
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'no-build') &&
      !contains(github.event.head_commit.message, 'no-release') &&
      !contains(github.event.head_commit.message, 'Lerna publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    # Job steps
    steps:
      - uses: actions/checkout@v4 # v4
        with:
          fetch-depth: 0

      - name: Download a single artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build storybook
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
        run: yarn storybook:build

      - name: Upload storybook
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy storybook
        id: deployment
        uses: actions/deploy-pages@v4
